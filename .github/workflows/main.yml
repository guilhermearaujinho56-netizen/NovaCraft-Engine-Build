name: Build NovaCraft Engine APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Amethyst Engine
        uses: actions/checkout@v4
        with:
          repository: AngelAuraMC/Amethyst-Android
          submodules: recursive
          path: engine

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        working-directory: engine
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app_pojavlauncher:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaCraft-Engine-APK
          path: engine/**/build/outputs/apk/debug/*.apk
